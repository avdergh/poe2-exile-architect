# DeepSeek Harness overlay: register the four Exile Architect MCP servers.
#
# This is the layer-1 adapter. Apply it to any DSH launch:
#
#     dsh web --patch <repo>/dsh/poe-bd.mcp.cordis.yml
#
# or merge its `- insert:` block into `$DSH_HOME/cordis.patch.yml` (all
# profiles) or `$DSH_HOME/profiles/<name>/cordis.patch.yml` (one profile) to
# keep the registration across runs. See dsh/README.md.
#
# Tool names appear in the session as `mcp__poe_knowledge__<tool>`,
# `mcp__poe_build__<tool>`, `mcp__poe_research__<tool>`,
# `mcp__poe_learning__<tool>`.
#
# Paths: every row resolves the checkout and the uv executable from the
# environment, falling back to the placeholder tokens below. A placeholder is
# NOT a usable path. Fill them in with either
#
#   scripts/install_dsh_preset.py install      # also writes a filled-in copy
#   install.ps1 -FromCheckout dsh             # Windows, one command
#   install.sh --from-checkout dsh            # macOS / Linux, one command
#
# or export POE_BD_CREATOR_ROOT=<repo-root> and, only when uv is not on PATH,
# POE_BD_UV=<uv executable>. uv on PATH covers every install documented in the
# root README.
#
# Use EITHER this patch (host-wide registration) OR the `poe-bd` preset. Applying
# both starts a second MCP client per server — two PoB engines — and exposes the
# tools to every session instead of just the poe-bd one.

- insert:
    - id: poe-knowledge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: poe_knowledge
        transport: stdio
        command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
        args: [run, python, -m, server.mcp.knowledge_server]
        cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
        env:
          PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
          PYTHONUTF8: '1'

    - id: poe-build-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: poe_build
        transport: stdio
        command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
        args: [run, python, -m, server.mcp.build_server]
        cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
        env:
          PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
          PYTHONUTF8: '1'

    - id: poe-research-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: poe_research
        transport: stdio
        command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
        args: [run, python, -m, server.mcp.research_server]
        cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
        env:
          PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
          PYTHONUTF8: '1'

    - id: poe-learning-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: poe_learning
        transport: stdio
        command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
        args: [run, python, -m, server.mcp.learning_server]
        cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
        env:
          PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
          PYTHONUTF8: '1'
