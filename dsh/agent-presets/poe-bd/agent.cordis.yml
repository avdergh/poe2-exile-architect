# The `poe-bd` agent preset: the standard coding agent plus the Exile Architect
# (poe-bd-creator) MCP toolset, its four workflow skills, and its persona.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context; every row here belongs to that session alone. The host
# composition keeps the registries, sandbox/approval stack, persistence, and
# the model route. A service row here MUST sit inside a group carrying an
# `isolate` realm; the `dsh-agent-presets` audit rejects a row that publishes a
# process-global service.
#
# The MCP rows (`@deepseek-ai/dsh-mcp-client`, shipped with DSH) spawn the four
# Exile Architect domain servers as stdio children and register their tools as
# `mcp__poe_<server>__<tool>`. They provide no service, so they need no realm.
#
# Install location (user-authored preset, one directory per preset):
#   ${DSH_HOME:-$HOME/.dsh}/.agent-presets/poe-bd/
# See dsh/README.md and scripts/install_dsh_preset.py.
#
# Repo paths: each MCP row resolves the checkout root from POE_BD_CREATOR_ROOT,
# falling back to the literal path below. The command uses POE_BD_UV when set,
# otherwise the repo uv.exe on Windows and `uv` from PATH elsewhere.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model, running on the
      DeepSeek Harness. Your working directory is {{cwd}}.

      This session mounts the `poe-bd` preset: the Exile Architect
      (poe-bd-creator) verification-first PoE2 BD research and generation
      toolset. All poe-bd capabilities are MCP tools under four namespaces:

      - `mcp__poe_knowledge__*` — corpus / graph / mechanics / Research
        queries and lifecycle knowledge;
      - `mcp__poe_build__*` — the headless PoB engine, compute, Judge, and
        Phase 5 generation runs;
      - `mcp__poe_research__*` — research intake and typed proposals;
      - `mcp__poe_learning__*` — Phase 7 comparative learning.

      Rules that always apply:

      - Load the matching skill before poe-bd work: `poe-bd-create`,
        `poe-bd-research`, `poe-bd-research-loop`, `poe-bd-learning-loop`.
        `poe-bd-research-worker` is internal and may be loaded only by an explicit
        Research Controller subagent assignment.
      - Never invent build numbers: DPS / EHP / resistances / Spirit must come
        from PoB readback and Judge; default Judge feedback is hard-only.
      - All PoB/compute tools share one active build and MUST be called
        serially; only corpus / graph / mechanics / static queries may run in
        parallel.
      - Do not search the repository for old candidates or artifacts instead
        of calling the MCP tools.
      - Keep user-facing output in natural language; never expose raw PoB
        XML / import codes, raw mature build material, or internal JSON.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# The shell tools consume the host registries; their executors stay on the
# host plane. Repo-mode research CLI calls (<research-cli>) run through these.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

# Only the model-facing controls; the task registry stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope.
# `baseUrl` is this preset's own directory, so the skills/ tree travels with
# the preset wherever it is installed. The four user-facing skills plus the internal Research Worker are
# discovered from there; the agent also sees any deployment/user skills.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool; the goal service stays on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is correct here.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm. The token meter stays on the host plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its backends live in the HOST composition; this
# preset contributes the delegation TOOLS. The learning/research loops map
# Codex Desktop tasks to DSH subagents, so these rows are part of the preset.
# `workflows` is per-agent, so its rows share one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── Exile Architect MCP servers ─────────────────────────────────────────────

# One dsh-mcp-client instance per domain server (same split as the Codex
# plugin's .mcp.json). Tools register as:
#   mcp__poe_knowledge__* / mcp__poe_build__* / mcp__poe_research__* /
#   mcp__poe_learning__*
# The stdio bridge scrubs credential-like ambient variables and DSH_* before
# launching the child; PYTHONPATH/PYTHONUTF8 are passed explicitly below.
- id: poe-knowledge-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_knowledge
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? (process.platform === 'win32' ? (process.env.POE_BD_CREATOR_ROOT ? process.env.POE_BD_CREATOR_ROOT + '/.tools/uv/uv.exe' : 'E:/poe-bd-creator/.tools/uv/uv.exe') : 'uv')"
    args: [run, python, -m, server.mcp.knowledge_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
      PYTHONUTF8: '1'

- id: poe-build-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_build
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? (process.platform === 'win32' ? (process.env.POE_BD_CREATOR_ROOT ? process.env.POE_BD_CREATOR_ROOT + '/.tools/uv/uv.exe' : 'E:/poe-bd-creator/.tools/uv/uv.exe') : 'uv')"
    args: [run, python, -m, server.mcp.build_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
      PYTHONUTF8: '1'

- id: poe-research-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_research
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? (process.platform === 'win32' ? (process.env.POE_BD_CREATOR_ROOT ? process.env.POE_BD_CREATOR_ROOT + '/.tools/uv/uv.exe' : 'E:/poe-bd-creator/.tools/uv/uv.exe') : 'uv')"
    args: [run, python, -m, server.mcp.research_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
      PYTHONUTF8: '1'

- id: poe-learning-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_learning
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? (process.platform === 'win32' ? (process.env.POE_BD_CREATOR_ROOT ? process.env.POE_BD_CREATOR_ROOT + '/.tools/uv/uv.exe' : 'E:/poe-bd-creator/.tools/uv/uv.exe') : 'uv')"
    args: [run, python, -m, server.mcp.learning_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? 'E:/poe-bd-creator'"
      PYTHONUTF8: '1'
