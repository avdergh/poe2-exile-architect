# The `poe-bd` agent preset: the standard coding agent (as the shipped `standard`
# preset defines it for DeepSeek Harness 0.1.6-alpha.1) plus the Exile Architect
# (poe-bd-creator) MCP toolset, its workflow skills, and its persona.
#
# Every row below mirrors the shipped `standard` preset of that DSH version so a
# version mismatch cannot make this preset unmountable: a row naming a plugin the
# running installation does not have makes `dsh-agent-presets` report the whole
# preset broken, which hides it from the picker. When DSH changes a row, change it
# here too — `scripts/install_dsh_preset.py doctor` and the repo's DSH tests cover
# the parts this repo can see, and `node .tmp/dsh_discover_check.mjs` (see the DSH
# notes in dsh/README.md) reproduces the mount verdict locally.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context; every row here belongs to that session alone. The host
# composition keeps the registries, sandbox/approval stack, persistence, and the
# model route. A service row here MUST sit inside a group carrying an
# `isolate` realm; the `dsh-agent-presets` audit rejects a row that publishes a
# process-global service.
#
# The MCP rows (`@deepseek-ai/dsh-mcp-client`, shipped with DSH) spawn the four
# Exile Architect domain servers as stdio children and register their tools as
# `mcp__poe_<server>__<tool>`. They provide no service, so they need no realm.
#
# Repo paths: every row resolves the checkout and the uv executable from
# POE_BD_CREATOR_ROOT / POE_BD_UV, falling back to the placeholder tokens below.
# `scripts/install_dsh_preset.py install` (and `install.ps1 -FromCheckout dsh` /
# `install.sh --from-checkout dsh`) bakes the real values into the installed
# copy, so a placed preset needs no environment variables at all.
#
# Do not also register these servers host-wide through
# `dsh/poe-bd.mcp.cordis.yml` or `dsh/bundle`: that starts a second client per
# server (two PoB engines) and makes the tools visible to sessions outside this
# preset.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.

      This session mounts the `poe-bd` preset: the Exile Architect
      (poe-bd-creator) verification-first PoE2 BD research and generation
      toolset. All poe-bd capabilities are MCP tools under four namespaces:

      - `mcp__poe_knowledge__*` — corpus / graph / mechanics / Research
        queries and lifecycle knowledge;
      - `mcp__poe_build__*` — the headless PoB engine, compute, Judge, and
        Phase 5 generation runs;
      - `mcp__poe_research__*` — research intake and typed proposals;
      - `mcp__poe_learning__*` — Phase 7 comparative learning.

      Rules that always apply:

      - Load the matching skill before poe-bd work: `poe-bd-create`,
        `poe-bd-research`, `poe-bd-learn`, `poe-bd-learning-loop`.
        `poe-bd-research-worker` is internal and may be loaded only by an explicit
        Research Controller subagent assignment.
      - Never invent build numbers: DPS / EHP / resistances / Spirit must come
        from PoB readback and Judge; default Judge feedback is hard-only.
      - All PoB/compute tools share one active build and MUST be called
        serially; only corpus / graph / mechanics / static queries may run in
        parallel.
      - Do not search the repository for old candidates or artifacts instead
        of calling the MCP tools.
      - Keep user-facing output in natural language; never expose raw PoB
        XML / import codes, raw mature build material, or internal JSON.
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Both shell tools consume the host registry from here; their executors
# (`bash-sandbox`/`pwsh-sandbox`) are host-plane.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

# Only the model-facing controls; the task registry stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill registry lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer, so they need no realm.
# `baseUrl` is the preset's own directory, so the skills root resolves wherever
# the preset is installed (the installer copies `skills/` beside this file).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane; the human command
# and the model-facing tool register into this preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is the correct
# lifetime here rather than a workaround.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the host
# composition; this preset contributes the delegation TOOLS, which resolve that
# host registry. `workflows` is per-agent, so every row reaching it shares one
# entry-local realm here. The Phase 7 research controller and learning loop drive
# their work through these delegation tools.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this preset
    # and remove `disabled` from the matching tool row.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off by default, matching the base row it mirrors.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. Research and Create use it for live
# references, so fetching is enabled.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── Exile Architect MCP servers ─────────────────────────────────────────────

# One dsh-mcp-client instance per domain server (same split as the Codex plugin's
# .mcp.json). Tools register as:
#   mcp__poe_knowledge__* / mcp__poe_build__* / mcp__poe_research__* /
#   mcp__poe_learning__*
# The stdio bridge scrubs credential-like ambient variables and DSH_* before
# launching the child; PYTHONPATH/PYTHONUTF8 are passed explicitly below.
- id: poe-knowledge-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_knowledge
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
    args: [run, python, -m, server.mcp.knowledge_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
      PYTHONUTF8: '1'

- id: poe-build-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_build
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
    args: [run, python, -m, server.mcp.build_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
      PYTHONUTF8: '1'

- id: poe-research-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_research
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
    args: [run, python, -m, server.mcp.research_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
      PYTHONUTF8: '1'

- id: poe-learning-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: poe_learning
    transport: stdio
    command: !!js "process.env.POE_BD_UV ?? '__POE_BD_UV__'"
    args: [run, python, -m, server.mcp.learning_server]
    cwd: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
    env:
      PYTHONPATH: !!js "process.env.POE_BD_CREATOR_ROOT ?? '__POE_BD_CREATOR_ROOT__'"
      PYTHONUTF8: '1'
