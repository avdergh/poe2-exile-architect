[project]
name = "poe2-build-mcp"
version = "0.1.56"
description = "MCP server for Path of Exile 2: queryable game corpus + Path-of-Building-faithful calculations."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "networkx>=3",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Required by the PoB certification gate so slow golden tests fail explicitly
    # instead of being mistaken for a completed pass.
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
